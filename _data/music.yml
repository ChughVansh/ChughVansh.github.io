# Instagram clips, self-hosted (MUS-3). Put the files in assets/video/ and list them here.
# A performance can also hold clips: give it a clips: list in the same format.
#   file:    the MP4 file name
#   poster:  a JPG still, same name is fine (optional but recommended)
#   caption: one plain sentence (optional)
#   instruments: shown in parentheses on a new line under the caption (optional)
#   alt:     what the clip shows, for people who cannot see it
# Example:
#   - file: clip-1.mp4
#     poster: clip-1.jpg
#     caption: "..."
#     alt: "..."
clips:
  - file: kal-chaudhavi-ki-raat-thi.mp4
    poster: kal-chaudhavi-ki-raat-thi.jpg
    caption: "I promise you I'm trying to move on!"
    instruments: "Tabla, Guitar, Harmonium"
    alt: "Vansh singing at home with a pair of tabla in front of him. The lyrics in English appear as text on the screen."
  - file: hawayei.mp4
    poster: hawayei.jpg
    caption: "Ohh... she mistakenly thinks she's forgettable"
    instruments: "Piano"
    alt: "Vansh sitting at a piano. The lyrics and their English interpretation appear as text on the screen."
  - file: chaudhavin-ka-chaand.mp4
    poster: chaudhavin-ka-chaand.jpg
    caption: "How to respond appropriately when your partner asks you, \"Honey, how do I look?\""
    instruments: "Harmonium, Tabla"
    alt: "Vansh singing, sitting on the floor. The lyrics and their English translation appear as text on the screen."
  - file: khud-se.mp4
    poster: khud-se.jpg
    caption: "I hope you show the same kindness and grace to yourself that you show others"
    instruments: "Guitar"
    alt: "Vansh playing guitar outdoors under trees. The English translation of the lyrics appears as text on the screen."
  - file: pee-loon.mp4
    poster: pee-loon.jpg
    caption: "Nonchalance sucks!"
    instruments: "Guitar"
    alt: "Vansh playing guitar outdoors. The English interpretation of the lyrics appears as text on the screen."
  - file: ismir-evening.mp4
    poster: ismir-evening.jpg
    caption: "Superstition @ ISMIR 2025!"
    alt: "Vansh singing into a microphone on a stage with a band behind him, under yellow and purple lights."
