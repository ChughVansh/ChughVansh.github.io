# Music page content. Add an entry, save, and it shows up.

# Select Performances, in the order shown. Every field except title is optional.
#   title:         name of the piece
#   composer:      who wrote it
#   event:         the concert or event it was part of
#   group:         the group you performed with
#   venue:         where it was performed
#   year:          year (or a full date as text)
#   role:          what you did (instrument, voice, or part)
#   setlist:       songs in the video. Each has a title, and may have artist, year,
#                  start (m:ss, makes the title link to that moment but is not shown)
#                  and role (when it differs from yours for the whole piece)
#   note:          one plain sentence, if useful
#   youtube:       the video id, the part after v= in the URL (or after youtu.be/).
#                  Test that the embed actually plays on the page. A video can look
#                  fine to YouTube's lookup and still block embedding. If it does,
#                  use link instead.
#   youtube_title: the video's title on YouTube, used as the embed's accessible name
#   link, link_label: a page about the event or the piece
