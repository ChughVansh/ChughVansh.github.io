# Order of the links in the top bar. The site name on the left is added by
# _includes/masthead.html and links home. "About" is the home page.
#
# "Experience" is the page at /experience/ (_pages/experience.html). Its projects come from
# the template's collection named "portfolio" (_portfolio/); only the page and label were renamed.
# new_tab: true opens a link in a new tab (used for the CV PDF).
main:
  - title: "About"
    url: /

  - title: "Experience"
    url: /experience/

  - title: "Publications"
    url: /publications/

  - title: "Music"
    url: /music/

  - title: "CV"
    url: /files/cv.pdf
    new_tab: true

  - title: "Contact"
    url: /contact/
